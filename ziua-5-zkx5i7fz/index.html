<style>
/* Layout: a lesson "stepper" — one step on screen at a time, sticky progress on top, fixed nav at the bottom; later steps stay locked until the current one is done */
:root{
  --bg:#FFF9FB; --surface:#FFFFFF; --soft:#F8E8EF; --soft-2:#FDF2F6;
  --pink:#C63D6C; --pink-ink:#A52E58; --plum:#26152C; --muted:#6A5571; --line:#EFD9E3;
  --sun:#F4C04B; --sun-soft:#FFF4D6; --sun-ink:#7A5500;
  --ok:#2E8A5C; --ok-soft:#E3F4EA; --bad:#C2403A; --bad-soft:#FBE6E4;
  --bubble-b:#C63D6C; --bubble-b-fg:#FFFFFF; --lock:#B9A6B4;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:18px; --nav-h:76px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1119; --surface:#251824; --soft:#3A2033; --soft-2:#2E1C2B;
  --pink:#F07CA2; --pink-ink:#F59BB8; --plum:#F7EAF0; --muted:#C7B0C2; --line:#40283A;
  --sun:#F4C04B; --sun-soft:#3A3018; --sun-ink:#F4C04B; --ok:#6FD3A0; --ok-soft:#1D3328; --bad:#F08C86; --bad-soft:#3D1F1D;
  --bubble-b:#B73663; --bubble-b-fg:#FFFFFF; --lock:#6E5868; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1A1119; --surface:#251824; --soft:#3A2033; --soft-2:#2E1C2B;
  --pink:#F07CA2; --pink-ink:#F59BB8; --plum:#F7EAF0; --muted:#C7B0C2; --line:#40283A;
  --sun:#F4C04B; --sun-soft:#3A3018; --sun-ink:#F4C04B; --ok:#6FD3A0; --ok-soft:#1D3328; --bad:#F08C86; --bad-soft:#3D1F1D;
  --bubble-b:#B73663; --bubble-b-fg:#FFFFFF; --lock:#6E5868; color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-bottom:calc(var(--nav-h) + 20px);scroll-padding-top:80px}
body{background:var(--bg);color:var(--plum);font-family:var(--f-body);font-size:17px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* Top progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;color:var(--pink);font-size:18px;white-space:nowrap}
.stepcount{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dots{display:flex;gap:4px}
.dot{flex:1;height:8px;border-radius:99px;background:var(--line);border:0;padding:0;min-width:0}
.dot.done{background:var(--pink)}
.dot.cur{background:var(--sun)}
.dot:disabled{cursor:default}

/* Stage */
main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:22px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.step{display:flex;flex-direction:column;gap:18px;animation:in .35s ease}
@keyframes in{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pink)}
.head{display:flex;flex-direction:column;gap:6px}
.head h2{font-size:clamp(26px,6vw,34px);font-weight:800}
.head p{color:var(--muted)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;gap:10px;align-items:center}
.nbtn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;min-height:52px}
.back{background:var(--soft);color:var(--plum)}
.next{flex:1;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.next:disabled{background:var(--soft);color:var(--muted);cursor:not-allowed}
.next svg{width:18px;height:18px}

/* Chips / misc */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--soft);font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--pink)}
.chip.live i{background:#D9534F}
.note{background:var(--sun-soft);border-radius:14px;padding:12px 16px;font-size:15px}
.note b{color:var(--pink-ink)}
.lockmsg{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;color:var(--muted);background:var(--soft-2);border:1px dashed var(--line);border-radius:14px;padding:10px 14px}
.lockmsg.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.lockmsg svg{width:18px;height:18px;flex:none}

/* Hero */
.hero{background:var(--surface);border-radius:22px;border-bottom:4px solid var(--sun);padding:24px;display:flex;flex-direction:column;gap:12px}
.day{font-family:var(--f-display);font-weight:800;color:var(--pink);font-size:clamp(44px,12vw,64px);line-height:1}
.date{color:var(--muted);font-weight:500;font-size:15px}
.hero h1{font-size:clamp(28px,7vw,40px);font-weight:800}
.hero .sub{color:var(--pink);font-weight:700;font-size:19px}
.hero .lead{color:var(--muted)}
.plan{display:grid;gap:8px;counter-reset:p;list-style:none;margin:0;padding:0}
.plan li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:600}
.plan li span{font-size:13px;color:var(--muted);font-weight:500;margin-left:auto;white-space:nowrap}
.plan li::before{counter-increment:p;content:counter(p);flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--pink);font-family:var(--f-display);font-weight:800;display:grid;place-items:center;font-size:14px}

/* Video + dialog */
.vwrap{border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%}
.vwrap video{width:100%;height:100%;display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center;min-height:44px}
.tbtn[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.tbtn svg{width:16px;height:16px}
.chat{display:flex;flex-direction:column;gap:10px}
.line{display:flex;flex-direction:column;max-width:88%;gap:2px;border:0;background:none;padding:0;text-align:left}
.line .who{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-inline:6px}
.line .bub{padding:10px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);transition:box-shadow .2s, transform .2s}
.line .en{font-weight:600}
.line .ro{display:none;font-size:15px;color:var(--muted);margin-top:4px;font-style:italic}
.line.b{align-self:flex-end;align-items:flex-end}
.line.b .bub{background:var(--bubble-b);color:var(--bubble-b-fg);border-color:transparent}
.line.b .ro{color:#FBE2EB}
.show-ro .ro{display:block}
.line.now .bub{box-shadow:0 0 0 3px var(--sun);transform:scale(1.02)}
.repeat-banner{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:3;background:var(--sun);color:#3A2600;font-weight:800;border-radius:14px;padding:12px 16px;text-align:center;font-size:17px}
.tip{font-size:14px;color:var(--muted)}

/* Audio player (dialogs without video) */
.player{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.playall{border:0;border-radius:14px;background:var(--pink);color:#fff;font-weight:800;font-size:17px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:10px}
.playall svg{width:20px;height:20px}
.playall[data-on="1"]{background:var(--plum);color:var(--bg)}
.pbar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--sun);transition:width .3s}
.card .phrase.price{font-size:34px;font-weight:800;color:var(--pink);font-variant-numeric:tabular-nums}

/* Expression cards */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;min-height:44px;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.tab .ck{color:var(--ok);font-weight:800}
.tab[aria-selected="true"] .ck{color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.card{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;text-align:left;min-height:140px;display:flex;flex-direction:column;gap:8px}
.card .emo{font-size:26px;line-height:1}
.card .phrase{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.2}
.card .tap{margin-top:auto;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pink)}
.card .tr{display:none;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.25}
.card .ex{display:none;font-size:14px;font-style:italic;margin-top:auto;opacity:.92}
.card.flipped{background:var(--pink);border-color:var(--pink);color:#fff}
.card.flipped .phrase,.card.flipped .tap,.card.flipped .tag{display:none}
.card.flipped .tr,.card.flipped .ex{display:block}
.card.flip-anim{animation:flip .3s ease}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.card.flip-anim{animation:none}}
.tag{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--sun);color:#3A2600;padding:3px 9px;border-radius:6px}
.card .seen{font-size:12px;font-weight:700;color:var(--ok)}

/* Formula */
.formula{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.formula h3{font-size:20px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.steps .n{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--pink);font-weight:800;display:grid;place-items:center;font-family:var(--f-display);font-style:normal}
.steps div>b{display:block}
.steps span b{color:var(--plum)}
.steps span{color:var(--muted);font-size:15px}

/* Mistakes (tap to reveal) */
.mist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.m{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left}
.m .wrong{color:var(--bad);font-weight:700}
.m.open .wrong{text-decoration:line-through;text-decoration-thickness:2px}
.m .right,.m .why{display:none}
.m.open .right{display:block;color:var(--ok);font-weight:800}
.m.open .why{display:block;font-size:14px;color:var(--muted)}
.m .hint{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pink)}
.m.open .hint{display:none}
.m.open{border-color:var(--ok)}
.mark{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:800;margin-right:6px;vertical-align:1px}
.mark.x{background:var(--bad-soft);color:var(--bad)}
.mark.v{background:var(--ok-soft);color:var(--ok)}

/* Exercises */
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:16px}
.q{display:flex;flex-direction:column;gap:10px}
.q .prompt{font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;text-align:left;font-weight:500;min-height:48px;width:100%}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--plum)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--plum)}
.opt:disabled{cursor:default}
.score{font-family:var(--f-display);font-weight:800;color:var(--pink);font-size:18px}
.fill{line-height:2.3;font-size:17px}
.gap{display:inline-block;min-width:74px;text-align:center;border-bottom:3px solid var(--line);padding-inline:6px;font-weight:700;line-height:1.4;border-radius:4px}
.gap.active{border-color:var(--pink);background:var(--soft)}
.gap.filled{border-color:var(--ok);color:var(--ok)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.word{border:2px solid var(--sun);background:var(--sun-soft);border-radius:12px;padding:10px 16px;font-weight:700;min-height:46px}
.word.used{opacity:.35;pointer-events:none}
.word.shake{animation:shake .35s;border-color:var(--bad);background:var(--bad-soft)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.col-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pool,.built{display:flex;flex-direction:column;gap:8px}
.built{background:var(--soft-2);border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:64px;counter-reset:o}
.built .opt{counter-increment:o;background:var(--surface)}
.built .opt::before{content:counter(o) ". ";font-weight:800;color:var(--pink)}
.built .empty{color:var(--muted);font-size:14px;padding:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sbtn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--soft);min-height:44px}
.fb{font-weight:700}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}

/* Homework */
.task{display:grid;grid-template-columns:auto 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.task .big{font-family:var(--f-display);font-weight:800;font-size:32px;color:var(--pink);line-height:1;width:34px}
.task h3{font-size:19px;margin-bottom:6px}
.task p{color:var(--muted)}
.task.bonus{background:var(--sun-soft);border-color:var(--sun)}
.task.bonus .big{color:var(--sun-ink)}
.template{margin-top:10px;background:var(--soft-2);border-radius:12px;padding:14px;line-height:2}
.blank{display:inline-block;min-width:60px;border-bottom:2px solid var(--pink);line-height:1.3}
.min0{min-width:0}

/* Final */
.check{background:var(--pink);color:#fff;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px}
.check h2{font-size:28px}
.check label{display:flex;gap:12px;align-items:flex-start;font-weight:600;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--sun);flex:none;margin-top:1px}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sun);transition:width .3s}
.confetti{font-size:54px;text-align:center;line-height:1}
footer{text-align:center;color:var(--muted);font-size:14px}
footer b{color:var(--pink)}
</style>

  <div class="top-in">
    <div class="top-row"><span class="brand">Ziua 5</span><span class="stepcount" id="stepcount"></span></div>

</header>

<main id="stage" aria-live="polite"></main>

  </div>
</nav>

/* ---------- state ---------- */
const KEY="eca-d5-v1";
let st={cur:0,max:0,done:{},ans:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&typeof s.cur==="number")st=Object.assign(st,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

/* ---------- steps ---------- */
const STEPS=[
 {k:"start",label:"Start"},
 {k:"dlg",i:0,label:"Dialogul 1"},{k:"dlg",i:1,label:"Dialogul 2"},{k:"dlg",i:2,label:"Dialogul 3"},{k:"dlg",i:3,label:"Dialogul 4"},
 {k:"expr",label:"Expresii"},{k:"recipe",label:"Transport în SUA"},{k:"mist",label:"Greșeli tipice"},
 {k:"ex1",label:"Exercițiul 1"},{k:"ex2",label:"Exercițiul 2"},{k:"ex3",label:"Exercițiul 3"},{k:"ex4",label:"Exercițiul 4"},
 {k:"hw",label:"Tema"},{k:"end",label:"Final"}
];

const NEXT_LABEL={start:"Începe lecția",end:"Lecție terminată"};
const stage=$("#stage"),nextBtn=$("#nextBtn"),backBtn=$("#backBtn"),dots=$("#dots");
let canNext=false,lockText="";

function setReady(ok,text){
  canNext=ok;lockText=text||"";
  const s=STEPS[st.cur];
  if(ok){st.done[st.cur]=1;save()}
  nextBtn.disabled=!ok;
  const label=NEXT_LABEL[s.k]||"Continuă";
  nextBtn.innerHTML=ok?`<span>${label}</span>${s.k==="end"?"":ICON.arrow}`:`${ICON.lock}<span>${s.k==="end"?label:"Continuă"}</span>`;
  const lm=stage.querySelector(".lockmsg");
  if(lm){lm.className="lockmsg"+(ok?" ok":"");lm.innerHTML=(ok?ICON.check:ICON.lock)+`<span>${esc(ok?(lm.dataset.done||"Gata! Poți merge mai departe."):text)}</span>`}
  renderDots();
}
function renderDots(){
  dots.innerHTML=STEPS.map((s,i)=>`<button class="dot ${i===st.cur?"cur":(st.done[i]?"done":"")}" ${i<=st.max?"":"disabled"} aria-label="${esc(s.label)}${i>st.max?" (blocat)":""}" data-i="${i}"></button>`).join("");
  $("#stepcount").textContent=`Pasul ${st.cur+1} din ${STEPS.length} · ${STEPS[st.cur].label}`;
}
dots.addEventListener("click",e=>{const b=e.target.closest(".dot");if(b&&!b.disabled)go(+b.dataset.i)});
function go(i){
  stopAudio();pauseVideos();
  st.cur=Math.max(0,Math.min(STEPS.length-1,i));st.max=Math.max(st.max,st.cur);save();
  backBtn.hidden=st.cur===0;
  stage.innerHTML="";
  const s=STEPS[st.cur];
  RENDER[s.k](s);
  try{window.scrollTo({top:0,behavior:"instant"})}catch(e){window.scrollTo(0,0)}
}
nextBtn.onclick=()=>{if(!canNext)return;if(st.cur<STEPS.length-1){st.max=Math.max(st.max,st.cur+1);go(st.cur+1)}};
backBtn.onclick=()=>go(st.cur-1);
function lockmsg(doneText){return `<div class="lockmsg" data-done="${esc(doneText||"")}"></div>`}
function add(html){const d=document.createElement("section");d.className="step";d.innerHTML=html;stage.appendChild(d);return d}

const RENDER={};

RENDER.expr=()=>{
  const el=add(`<div class="head"><span class="eyebrow">Pasul 6 · Vocabular</span><h2>Expresii pentru transport și aeroport</h2><p>Citește expresia, ghicește traducerea, apoi apasă pe card ca să-l întorci și să auzi pronunția. Deschide toate cele 5 categorii.</p></div>
  ${lockmsg("Super! Ai văzut toate categoriile.")}
  <div class="tabs" role="tablist"></div><div class="cards"></div>`);
  const tabs=el.querySelector(".tabs"),cards=el.querySelector(".cards");
  st.ans.tabs=st.ans.tabs||{};
  function check(){const n=Object.keys(st.ans.tabs).length;save();
    if(n>=groups.length)setReady(true);else setReady(false,`Deschide toate categoriile: ${n} din ${groups.length}.`)}
  function show(gi){
    st.ans.tabs[gi]=1;
    tabs.innerHTML=groups.map((g,i)=>`<button class="tab" role="tab" type="button" aria-selected="${i===gi}" data-i="${i}">${st.ans.tabs[i]&&i!==gi?'<span class="ck">✓</span>':""}${esc(g.n)} · ${g.items.length}</button>`).join("");
    cards.innerHTML=groups[gi].items.map((it,k)=>`<button class="card" type="button" data-k="${k}"><span class="emo" aria-hidden="true">${it[0]}</span>${it[4]?`<span class="tag">${esc(it[4])}</span>`:""}<span class="phrase">${esc(it[1])}</span><span class="tap">Apasă · ascultă</span><span class="tr">${esc(it[2])}</span><span class="ex">${esc(it[3])}</span></button>`).join("");
    cards.querySelectorAll(".card").forEach(c=>c.onclick=()=>{const f=c.classList.toggle("flipped");c.classList.remove("flip-anim");void c.offsetWidth;c.classList.add("flip-anim");if(f)play(`d5_g${gi}_${c.dataset.k}`)});
    check();
  }
  tabs.addEventListener("click",e=>{const t=e.target.closest(".tab");if(t){show(+t.dataset.i);t.scrollIntoView({inline:"nearest",block:"nearest"})}});
  show(0);
};

RENDER.ex2=()=>{
  const el=add(`<div class="head"><span class="eyebrow">Exercițiul 2 din 4</span><h2>${esc(fillTitle)}</h2><p>Spațiul roz e cel activ. Apasă cuvântul potrivit de mai jos.</p></div>

    let n=0;
    fill.innerHTML=fillParts.map(p=>{if(typeof p==="string")return esc(p);const i=n++;return `<span class="gap ${i<pos?"filled":(i===pos?"active":"")}">${i<pos?esc(answers[i]):"&nbsp;"}</span>`}).join("");

      if(pos>=answers.length)return;

  <div class="banner-slot"></div>
  <div class="chat">${d.lines.map((l,k)=>`<button type="button" class="line ${l[1]}" data-k="${k}"><span class="who">${esc(l[0])}</span><span class="bub"><span class="en">${esc(l[2])}</span><span class="ro">${esc(l[3])}</span></span></button>`).join("")}</div>
  <div class="note">${d.note}</div>`);
  const chat=el.querySelector(".chat"),lines=[...chat.querySelectorAll(".line")];
  const trb=el.querySelector(".trb"),rpt=el.querySelector(".rpt"),slot=el.querySelector(".banner-slot");
  trb.onclick=()=>{const on=chat.classList.toggle("show-ro");trb.setAttribute("aria-pressed",on)};
  if(hasVideo){videoMode(el,d,lines,chat,rpt,slot);return}
  if(st.done[st.cur])setReady(true);else setReady(false,"Ascultă tot dialogul ca să mergi mai departe.");
  function hi(k){lines.forEach((n,j)=>n.classList.toggle("now",j===k));if(k>=0){const r=lines[k].getBoundingClientRect();if(r.top<90||r.bottom>innerHeight-100)lines[k].scrollIntoView({block:"center",behavior:"smooth"})}}
  function banner(t){slot.innerHTML=t?`<div class="repeat-banner">${t}</div>`:""}
  let repeat=false,run=0,waitT=null;
  const heard=new Set(st.ans["h"+s.i]||[]);
  const bar=el.querySelector(".pbar i"),pa=el.querySelector(".playall");
  function mark(k){heard.add(k);st.ans["h"+s.i]=[...heard];save();if(bar)bar.style.width=(heard.size/d.lines.length*100)+"%";if(heard.size>=d.lines.length&&!canNext)setReady(true)}
  if(bar)bar.style.width=(heard.size/d.lines.length*100)+"%";
  function stop(){run++;clearInterval(waitT);banner("");stopAudio();hi(-1);if(pa)pa.querySelector("span").textContent="Ascultă tot dialogul"}
  function sayLine(k,cb){
    stopAudio();const a=new Audio(`audio/d5_d${s.i}_${k}.mp3`);curAudio=a;hi(k);
    let fired=false;const done=()=>{if(fired)return;fired=true;mark(k);cb&&cb()};
    a.onended=done;a.onerror=done;const p=a.play();if(p&&p.catch)p.catch(done);
  }
  function seq(k,token){
    if(token!==run||k>=d.lines.length){if(token===run)stop();return}
    sayLine(k,()=>{
      if(token!==run)return;
      if(repeat){let left=Math.max(3,Math.ceil(d.lines[k][2].split(" ").length*0.6));banner(`🎤 Repetă acum cu voce tare! ${left}`);
        clearInterval(waitT);waitT=setInterval(()=>{if(token!==run){clearInterval(waitT);return}left--;if(left<=0){clearInterval(waitT);banner("");seq(k+1,token)}else banner(`🎤 Repetă acum cu voce tare! ${left}`)},1000)}
      else setTimeout(()=>seq(k+1,token),350);
    });
  }
  if(pa)pa.onclick=()=>{const playing=pa.dataset.on==="1";stop();pa.dataset.on=playing?"0":"1";if(playing)return;pa.querySelector("span").textContent="Stop";seq(0,run)};
  lines.forEach((n,k)=>n.onclick=()=>{stop();if(pa)pa.dataset.on="0";if(repeat){if(pa){pa.dataset.on="1";pa.querySelector("span").textContent="Stop"}seq(k,run)}else sayLine(k,()=>hi(-1))});
  rpt.onclick=()=>{repeat=!repeat;rpt.setAttribute("aria-pressed",repeat);stop();if(pa)pa.dataset.on="0";
    if(repeat){if(pa){pa.dataset.on="1";pa.querySelector("span").textContent="Stop"}seq(0,run)}};
};

function videoMode(el,d,lines,chat,rpt,slot){
  const v=el.querySelector("video");
  if(st.done[st.cur])setReady(true);else setReady(false,"Privește videoul până la final ca să mergi mai departe.");
  let watched=0,lastT=0,repeat=false,stopAt=null,waitT=null,hold=null;
  const startOf=k=>d.times[k],endOf=k=>k+1<d.times.length?d.times[k+1]:d.end;
  const idxAt=t=>{let r=-1;d.times.forEach((x,k)=>{if(t>=x-0.05)r=k});return r};
  function hi(k){lines.forEach((n,j)=>n.classList.toggle("now",j===k))}
  function banner(t){slot.innerHTML=t?`<div class="repeat-banner">${t}</div>`:""}
  v.addEventListener("timeupdate",()=>{
    const t=v.currentTime;
    if(t>lastT&&t-lastT<1.5)watched+=t-lastT; lastT=t;
    hi(v.paused&&hold!==null?hold:idxAt(t));
    if(!canNext&&v.duration&&watched>=v.duration*0.85)setReady(true);
    if(stopAt!==null&&t>=stopAt){
      const done=stopAt;stopAt=null;v.pause();hold=idxAt(done-0.1);hi(hold);
      if(repeat){const k2=idxAt(done-0.1);let left=Math.max(3,Math.min(7,Math.ceil((endOf(k2)-startOf(k2))*1.3)));
        banner(`🎤 Repetă acum cu voce tare! ${left}`);clearInterval(waitT);
        waitT=setInterval(()=>{left--;if(left<=0){clearInterval(waitT);banner("");if(repeat&&k2+1<d.times.length){stopAt=endOf(k2+1);v.play().catch(()=>{})}}else banner(`🎤 Repetă acum cu voce tare! ${left}`)},1000)}
    }
  });
  v.addEventListener("seeked",()=>{lastT=v.currentTime});
  v.addEventListener("ended",()=>{setReady(true);hi(-1);banner("")});
  v.addEventListener("error",()=>{if(!canNext)setReady(true)});
  v.addEventListener("play",()=>{hold=null;stopAudio();if(repeat&&stopAt===null){stopAt=endOf(Math.max(0,idxAt(v.currentTime)))}});
  lines.forEach((n,k)=>n.onclick=()=>{clearInterval(waitT);banner("");v.currentTime=startOf(k);stopAt=endOf(k);v.play().catch(()=>{})});
  rpt.onclick=()=>{repeat=!repeat;rpt.setAttribute("aria-pressed",repeat);clearInterval(waitT);banner("");
    if(repeat){const k=Math.max(0,idxAt(v.currentTime));v.currentTime=startOf(k);stopAt=endOf(k);v.play().catch(()=>{})}else stopAt=null};
}
