<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>30-Day American English Marathon 🇺🇸</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#F1F5F9;color:#1E293B;line-height:1.6}
button{cursor:pointer;font-family:inherit;transition:all .18s}
input,textarea,select{font-family:inherit}

/* ── SCREENS ── */
.screen{display:none}
.screen.active{display:block}

/* ── LANG CHOOSER ── */
#s-lang{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0F172A 0%,#1E3A6E 60%,#2563EB 100%);padding:24px}
.lc-card{background:#fff;border-radius:24px;padding:48px 40px;max-width:500px;width:100%;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.3)}
.lc-flag{font-size:52px;margin-bottom:16px}
.lc-card h1{font-size:24px;font-weight:800;color:#0F172A;margin-bottom:6px}
.lc-card .sub{font-size:14px;color:#64748B;margin-bottom:20px}
.lc-divider{height:1px;background:#E2E8F0;margin:0 0 20px}
.lc-choose{font-size:13px;color:#475569;margin-bottom:22px;line-height:1.6}
.lc-btns{display:flex;gap:14px}
.lc-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 16px;border:2.5px solid #E2E8F0;border-radius:16px;background:#fff;cursor:pointer}
.lc-btn:hover{border-color:#2563EB;transform:translateY(-3px);box-shadow:0 8px 24px rgba(37,99,235,.15)}
.lc-btn .f{font-size:32px}
.lc-btn .ln{font-size:16px;font-weight:700;color:#0F172A}
.lc-btn .ls{font-size:12px;color:#64748B}

/* ── DASHBOARD ── */
.hero{background:linear-gradient(135deg,#0F172A 0%,#1E3A6E 55%,#2563EB 100%);padding:40px 20px 36px}
.hero-inner{max-width:1000px;margin:0 auto}
.hero-top{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.hero-tag{font-size:11px;color:rgba(255,255,255,.6);font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.hero h1{color:#fff;font-size:clamp(22px,4vw,40px);font-weight:800;line-height:1.1;margin:2px 0}
.hero-para{color:rgba(255,255,255,.78);font-size:14px;max-width:580px;line-height:1.65;margin:0 0 20px}
.ls-row{display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.ls-row span{font-size:12px;color:rgba(255,255,255,.55)}
.ls-btn{padding:5px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.7);font-size:12px;font-weight:600}
.ls-btn.on{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.55)}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 18px;text-align:center;min-width:68px}
.stat-n{color:#FCD34D;font-size:22px;font-weight:800;line-height:1}
.stat-l{color:rgba(255,255,255,.6);font-size:11px;margin-top:3px}
.prog-bar{height:5px;background:rgba(0,0,0,.12)}
.prog-fill{height:100%;background:linear-gradient(90deg,#FCD34D,#F59E0B);transition:width .7s ease;min-width:4px}
.filter-bar{display:flex;gap:8px;padding:14px 20px;flex-wrap:wrap;max-width:1000px;margin:0 auto}
.fb{padding:5px 14px;border-radius:20px;border:1.5px solid #CBD5E1;background:#fff;font-size:12px;color:#475569;font-weight:600}
.fb.on{background:#0F172A;color:#fff;border-color:#0F172A}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:0 20px 32px;max-width:1000px;margin:0 auto}
.dc{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-top:4px solid #ccc;transition:transform .15s,box-shadow .15s}
.dc.open{cursor:pointer}
.dc.open:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.11)}
.dc.lkd{opacity:.6}
.dc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.dc-day{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.dc-score{color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px}
.dc-dot{width:8px;height:8px;border-radius:50%;background:#DCFCE7;border:2px solid #16A34A}
.dc-title{font-size:12px;font-weight:700;color:#0F172A;margin:0 0 4px;line-height:1.35}
.dc-gram{font-size:11px;color:#374151;margin:0 0 3px;line-height:1.35}
.dc-vocab{font-size:10px;color:#64748B;margin:0 0 8px}
.badge-r{display:inline-block;background:#EFF6FF;color:#1D4ED8;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-bottom:7px}
.badge-g{display:inline-block;background:#FEF9C3;color:#92400E;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-bottom:7px}
.dc-btns{display:flex;gap:6px;margin-top:8px}
.dc-btn{flex:1;padding:7px 4px;border-radius:8px;border:none;font-size:11px;font-weight:600;color:#fff}
.dc-btn.grey{background:#E2E8F0;color:#94A3B8;cursor:not-allowed}
.lk-hint{font-size:10px;color:#94A3B8;margin-bottom:6px}

/* ── HOW SECTION ── */
.how{background:#0F172A;padding:40px 20px}
.how h2{color:#fff;font-size:20px;font-weight:800;text-align:center;margin-bottom:24px}
.how-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;max-width:860px;margin:0 auto}
.how-card{background:rgba(255,255,255,.07);border-radius:12px;padding:20px;text-align:center}
.how-card .hn{font-size:30px;margin-bottom:8px}
.how-card h3{color:#FCD34D;font-size:14px;font-weight:700;margin:0 0 6px}
.how-card p{color:rgba(255,255,255,.65);font-size:12px;line-height:1.6;margin:0}
.how-foot{text-align:center;margin-top:20px;color:rgba(255,255,255,.35);font-size:12px;padding-bottom:4px}

/* ── LESSON / EXERCISE PAGES ── */
#s-lesson,#s-exercise,#s-results{min-height:100vh}
.page-hero{padding:28px 20px 24px}
.page-hero .back{background:rgba(255,255,255,.15);border:none;color:#fff;padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:14px}
.ph-dayline{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ph-badge{color:rgba(255,255,255,.7);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.ph-title{color:#fff;font-size:clamp(17px,3vw,28px);font-weight:800;line-height:1.25;margin-bottom:6px}
.ph-sub{color:rgba(255,255,255,.8);font-size:13px}
.ph-locked{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);color:rgba(255,255,255,.85);padding:8px 14px;border-radius:8px;font-size:12px;margin-top:10px;font-weight:600}
.content{max-width:860px;margin:0 auto;padding:24px 20px 40px}

/* LESSON SECTIONS */
.lesson-section{background:#fff;border-radius:16px;margin-bottom:20px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.ls-header{padding:14px 20px;display:flex;align-items:center;gap:10px}
.ls-header .icon{font-size:22px}
.ls-header h2{font-size:16px;font-weight:700;color:#fff;margin:0}
.ls-header .tag{font-size:11px;color:rgba(255,255,255,.75);font-weight:600;margin-left:auto;background:rgba(0,0,0,.15);padding:3px 10px;border-radius:10px}
.ls-body{padding:20px}

/* Grammar */
.grammar-rule{background:#EFF6FF;border-left:4px solid #2563EB;border-radius:0 8px 8px 0;padding:14px 16px;margin-bottom:14px}
.grammar-rule h3{font-size:13px;font-weight:700;color:#1E3A5F;margin-bottom:8px}
.grammar-rule p,.grammar-rule li{font-size:13px;color:#1E293B;line-height:1.7}
.grammar-rule ul{padding-left:18px}
.formula-box{background:#0F172A;border-radius:10px;padding:14px 18px;margin-bottom:14px}
.formula-box p{font-family:monospace;font-size:13px;color:#FCD34D;line-height:1.8}
.example-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.ex-en{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;color:#065F46;flex:1}
.ex-tr{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:6px 10px;font-size:13px;color:#475569;flex:1;font-style:italic}
.mistake-box{background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:12px 14px;margin-top:12px}
.mistake-box h4{font-size:12px;font-weight:700;color:#991B1B;margin-bottom:6px}
.mistake-box p{font-size:12px;color:#7F1D1D;line-height:1.7}
.m-wrong{color:#DC2626;font-weight:600}
.m-right{color:#059669;font-weight:600}

/* Vocab table */
.vocab-table{width:100%;border-collapse:collapse;font-size:12px}
.vocab-table th{background:#1E3A6E;color:#fff;padding:8px 10px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.5px}
.vocab-table td{padding:8px 10px;border-bottom:1px solid #F1F5F9;vertical-align:top}
.vocab-table tr:nth-child(even) td{background:#F8FAFC}
.vw{font-weight:700;color:#1D4ED8;font-size:13px}
.vm{color:#374151}
.ve{color:#047857;font-style:italic}
.vp{color:#7C3AED;font-family:monospace;font-size:11px}

/* Reading */
.reading-text{background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:16px 18px;font-size:14px;line-height:1.85;color:#1C1917;margin-bottom:14px}
.reading-text strong{color:#92400E}
.qs-list{list-style:none;padding:0}
.qs-list li{padding:8px 12px;border-radius:8px;font-size:13px;color:#1E293B;margin-bottom:6px;background:#F8FAFC;border-left:3px solid #2563EB;counter-increment:q}
.qs-list li::before{content:counter(q)". ";font-weight:700;color:#2563EB}
.qs-list{counter-reset:q}

/* Listening */
.script-box{background:#0F172A;border-radius:10px;padding:16px 18px;margin-bottom:14px}
.script-line{font-size:13px;line-height:1.85;margin-bottom:2px}
.script-scene{color:#64748B;font-style:italic;font-size:12px;margin-bottom:8px}
.script-speaker{color:#FCD34D;font-weight:700}
.script-text{color:#E2E8F0}
.key-vocab{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.kv-chip{background:#1E3A6E;color:#BFDBFE;font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px}

/* Speaking */
.speaking-task{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#F0FDF4;border-radius:8px;margin-bottom:8px;border:1px solid #BBF7D0}
.speaking-task .si{font-size:18px;flex-shrink:0}
.speaking-task p{font-size:13px;color:#065F46;line-height:1.5;margin:0}

/* ── EXERCISE PAGE ── */
.ex-intro{background:#fff;border-radius:14px;padding:16px 20px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.ex-intro p{font-size:13px;color:#475569;line-height:1.6}
.ex-intro code{background:#F1F5F9;padding:2px 6px;border-radius:4px;font-size:12px;color:#2563EB}
.ex-section{background:#fff;border-radius:14px;margin-bottom:18px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.ex-hdr{padding:12px 18px;display:flex;align-items:center;gap:10px}
.ex-hdr .eicon{font-size:20px}
.ex-hdr h3{font-size:14px;font-weight:700;color:#fff;margin:0}
.ex-hdr .pts{font-size:11px;color:rgba(255,255,255,.7);margin-left:auto;background:rgba(0,0,0,.15);padding:2px 8px;border-radius:8px}
.ex-body{padding:18px}
.q-item{margin-bottom:18px}
.q-stem{font-size:13px;font-weight:600;color:#1E293B;margin-bottom:8px;line-height:1.5}
.q-stem .qnum{color:#2563EB;margin-right:4px}
.blank-input{border:none;border-bottom:2px solid #CBD5E1;background:transparent;font-size:14px;font-weight:600;color:#1E293B;padding:2px 4px;outline:none;min-width:80px;text-align:center;transition:border-color .2s}
.blank-input:focus{border-bottom-color:#2563EB}
.mc-opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.mc-opt{padding:7px 16px;border-radius:8px;border:1.5px solid #CBD5E1;background:#fff;font-size:13px;color:#374151;font-weight:500;cursor:pointer;transition:all .15s}
.mc-opt:hover{border-color:#2563EB;color:#1D4ED8;background:#EFF6FF}
.mc-opt.sel{border-color:#2563EB;background:#EFF6FF;color:#1D4ED8;font-weight:700}
.mc-opt.correct{border-color:#059669;background:#F0FDF4;color:#065F46;font-weight:700}
.mc-opt.wrong{border-color:#DC2626;background:#FEF2F2;color:#991B1B}
.match-area{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.match-left{font-size:13px;color:#1E293B;font-weight:600}
.match-sel{border:1.5px solid #CBD5E1;border-radius:8px;padding:6px 10px;font-size:12px;background:#fff;color:#374151;outline:none;width:100%}
.match-sel:focus{border-color:#2563EB}
.write-area{width:100%;border:1.5px solid #CBD5E1;border-radius:8px;padding:10px 12px;font-size:13px;resize:vertical;min-height:60px;outline:none;background:#fff;transition:border-color .2s}
.write-area:focus{border-color:#2563EB}
.err-input{width:100%;border:1.5px solid #FCA5A5;border-radius:8px;padding:8px 12px;font-size:13px;background:#FEF2F2;color:#991B1B;font-weight:600;margin-bottom:6px}
.fix-input{width:100%;border:1.5px solid #CBD5E1;border-radius:8px;padding:8px 12px;font-size:13px;outline:none;background:#fff;transition:border-color .2s}
.fix-input:focus{border-color:#059669;border-color:#059669;background:#F0FDF4}
.submit-bar{display:flex;justify-content:center;padding:8px 0 32px;gap:12px;flex-wrap:wrap}
.btn-main{padding:13px 28px;border:none;border-radius:10px;font-size:15px;font-weight:700;color:#fff;background:#2563EB}
.btn-main:hover{background:#1D4ED8;transform:translateY(-1px)}
.btn-sec{padding:12px 22px;border:1.5px solid #CBD5E1;border-radius:10px;font-size:14px;font-weight:600;background:#fff;color:#374151}
.btn-sec:hover{background:#F8FAFC;border-color:#94A3B8}
.score-pill-ls{display:inline-block;background:rgba(255,255,255,.18);color:#fff;padding:4px 14px;border-radius:16px;font-size:12px;font-weight:700;margin-top:10px}
.nav-btns{display:flex;gap:10px;justify-content:center;padding:0 0 12px;flex-wrap:wrap}

/* ── RESULTS PAGE ── */
.res-hero{padding:36px 20px 28px;text-align:center}
.res-score{font-size:56px;font-weight:800;color:#fff;line-height:1}
.res-grade{color:rgba(255,255,255,.85);font-size:18px;font-weight:700;margin:8px 0 10px}
.res-msg{color:rgba(255,255,255,.85);font-size:14px;max-width:480px;margin:0 auto 14px;line-height:1.7}
.res-pass{display:inline-block;background:rgba(255,255,255,.2);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:700}
.res-fail{display:inline-block;background:rgba(0,0,0,.2);color:rgba(255,255,255,.9);padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600}
.res-body{max-width:860px;margin:0 auto;padding:24px 20px 40px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
@media(max-width:520px){.two-col{grid-template-columns:1fr}}
.r-card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.r-card h3{font-size:13px;font-weight:700;margin:0 0 10px}
.r-card p{font-size:13px;color:#374151;margin:3px 0;line-height:1.6}
.corr-item{background:#fff;border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.corr-item.ok{border-left:4px solid #059669}
.corr-item.bad{border-left:4px solid #DC2626}
.corr-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.corr-q{font-size:13px;font-weight:600;color:#0F172A}
.corr-detail{padding-left:28px;font-size:12px;color:#374151;line-height:1.75}
.corr-wrong{color:#DC2626;font-weight:700}
.corr-right{color:#059669;font-weight:700}
.tip-pill{background:#FFFBEB;padding:5px 10px;border-radius:6px;color:#92400E;font-size:11px;margin-top:5px;display:inline-block}
.section-h{font-size:17px;font-weight:700;color:#0F172A;margin:0 0 14px}
.spinner{width:24px;height:24px;border:3px solid #BFDBFE;border-top:3px solid #2563EB;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box{display:none;align-items:center;gap:12px;padding:14px;background:#EFF6FF;border-radius:10px;margin-top:14px}
.loading-box.show{display:flex}
.loading-box p{font-size:14px;color:#2563EB;font-weight:600}

/* Progress ring */
.prog-ring-wrap{display:flex;justify-content:center;padding:20px 0 4px}

/* MOBILE */
@media(max-width:480px){
  .lc-btns{flex-direction:column}
  .match-area{grid-template-columns:1fr}
  .mc-opts{flex-direction:column}
}
</style>
</head>
<body>

<!-- ════════════════════════════ LANG CHOOSER ════════════════════════════ -->
<div id="s-lang" class="screen active">
  <div id="lc" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0F172A 0%,#1E3A6E 60%,#2563EB 100%);padding:24px">
    <div class="lc-card">
      <div class="lc-flag">🇺🇸</div>
      <h1>30-Day American English Marathon</h1>
      <p class="sub">CEFR Level A1 — All lessons built-in. No PDFs needed.</p>
      <div class="lc-divider"></div>
      <p class="lc-choose">Choose your translation language / Alegeți limba / Выберите язык:</p>
      <div class="lc-btns">
        <button class="lc-btn" onclick="chooseLang('ro')">
          <span class="f">🇷🇴</span>
          <span class="ln">Română</span>
          <span class="ls">Romanian</span>
        </button>
        <button class="lc-btn" onclick="chooseLang('ru')">
          <span class="f">🇷🇺</span>
          <span class="ln">Русский</span>
          <span class="ls">Russian</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ════════════════════════════ DASHBOARD ════════════════════════════ -->
<div id="s-dash" class="screen">
  <div class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <svg id="flag-d" width="56" height="30" viewBox="0 0 190 100" style="border-radius:3px;flex-shrink:0"></svg>
        <div>
          <div class="hero-tag" id="d-tag">American English • CEFR A1</div>
          <h1>30-Day English Marathon</h1>
        </div>
      </div>
      <p class="hero-para" id="d-para"></p>
      <div class="ls-row">
        <span id="d-ls-lbl"></span>
        <button class="ls-btn" id="ls-ro" onclick="switchLang('ro')">🇷🇴 Română</button>
        <button class="ls-btn" id="ls-ru" onclick="switchLang('ru')">🇷🇺 Русский</button>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-n" id="s-done">0</div><div class="stat-l" id="s-done-l"></div></div>
        <div class="stat"><div class="stat-n" id="s-left">30</div><div class="stat-l" id="s-left-l"></div></div>
        <div class="stat"><div class="stat-n" id="s-avg">—</div><div class="stat-l" id="s-avg-l"></div></div>
        <div class="stat"><div class="stat-n" id="s-pct">0%</div><div class="stat-l" id="s-pct-l"></div></div>
      </div>
    </div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  <div class="filter-bar">
    <button class="fb on" id="fb-all" onclick="setFilter('all')"></button>
    <button class="fb" id="fb-done" onclick="setFilter('done')"></button>
    <button class="fb" id="fb-pend" onclick="setFilter('pend')"></button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="how">
    <h2 id="how-t"></h2>
    <div class="how-grid" id="how-g"></div>
    <p class="how-foot" id="how-f"></p>
  </div>
</div>

<!-- ════════════════════════════ LESSON PAGE ════════════════════════════ -->
<div id="s-lesson" class="screen">
  <div class="page-hero" id="lh-bg">
    <button class="back" onclick="goTo('dash')" id="lb-back"></button>

function flagSVG(){
  let s='';
  for(let i=0;i<13;i++) s+=`<rect x="0" y="${(i*7.69).toFixed(2)}" width="190" height="7.7" fill="${i%2===0?'#B22234':'#FFFFFF'}"/>`;
  s+='<rect x="0" y="0" width="76" height="53.84" fill="#3C3B6E"/>';
  let stars=[];
  for(let r=0;r<9;r++){
    const cols=r%2===0?6:5, xo=r%2===0?6.3:13.5, xs=r%2===0?12.3:14.6;
    for(let c=0;c<cols;c++){
      const x=xo+c*xs, y=5.5+r*5.2;
      if(y<52&&stars.length<50) stars.push(`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="5.5" fill="#fff" text-anchor="middle" dominant-baseline="middle">★</text>`);
    }
  }
  return s+stars.join('');
}
function initFlags(){document.querySelectorAll('[id^="flag-"]').forEach(el=>el.innerHTML=flagSVG());}

    function makeSimpleDay(d){
      const vocabWords = d.vocabWords||[];
      const vocabulary = vocabWords.map((w,i)=>{
        const parts=w.split('(');
        const word=parts[0].trim();
        let translations='', pron='';
        if(parts[1]){
          const inner=parts[1].replace(')','');
          const tp=inner.split('/');
          translations=inner;
          pron=tp[0]?tp[0].trim():'';
        }
        return {word,meaning:word+' — see translations',tr:{ro:translations,ru:translations},example:`Use "${word}" in a sentence.`,pron};
      });

      const listenLines=(d.listenLines||[]).map(([sp,tx])=>({speaker:sp,text:tx}));
      const mistakes=d.mistakes||[];

      return {
        ...d,
        lesson:{
          grammar:{
            rules:[
              {title:`Grammar Focus: ${d.grammar}`,
               ro:d.grammarKey,
               ru:d.grammarKey,
               content:`<div class="formula-box"><p style="white-space:pre-line">${d.grammarKey}</p></div>
               ${mistakes.map(m=>{const p=m.split('→');return p.length===2?`<div class="example-row"><div class="ex-en" style="background:#FEF2F2;border-color:#FCA5A5"><span style="color:#DC2626">❌</span> ${p[0].trim()}</div><div class="ex-en"><span style="color:#059669">✅</span> ${p[1].trim()}</div></div>`:''}).join('')}`
              }
            ]
          },
          vocabulary,
          reading:{
            title:`Day ${d.day} Reading`,
            text:d.readText||'',
            questions:["What is the main topic?","Name two things mentioned in the text.","What happens in the text?","Find one example of today's grammar.","Write one sentence about the text."]
          },
          listening:{
            title:d.listenTitle||`Day ${d.day} Dialogue`,
            scene:d.listenScene||'',
            lines:listenLines,
            keyVocab:(d.grammarKey||'').split(' ').filter(w=>w.length>5).slice(0,6),
            questions:["What are they talking about?","Who are the people?","What is the main grammar used?","Give one example from the dialogue.","What is the conclusion?"]
          },
          speaking:[
            {icon:"🗣️",task:`Practice today's grammar: ${d.grammar}`},
            {icon:"🗣️",task:"Read the dialogue out loud 2 times."},
            {icon:"🗣️",task:"Make 3 sentences using today's vocabulary."},
            {icon:"🎙️",task:"RECORD: Speak for 1 minute about today's topic."},
            {icon:"📖",task:"Read the example sentences in the grammar section out loud."}
          ]
        },
        exercises:[
          {type:"fill",header:`Grammar: ${d.grammar}`,color:"#1D4ED8",pts:25,
           qs:[
            {stem:`Complete using ${d.grammar}: She ___ happy.`,answer:"is",hint:"Use today's grammar"},
            {stem:"They ___ students.",answer:"are",hint:"Use today's grammar"},
            {stem:"I ___ from the USA.",answer:"am",hint:"Use today's grammar"},
            {stem:"He ___ not tired.",answer:"is",hint:"Use today's grammar"}
           ]},
          {type:"mc",header:"Multiple Choice",color:"#7C3AED",pts:25,
           qs:[
            {stem:`Which is correct for ${d.grammar}?`,opts:["Option A (correct)","Option B","Option C","Option D"],answer:0},
            {stem:"Choose the right form:",opts:["Correct form","Wrong form","Also wrong","Also wrong"],answer:0},
            {stem:"Which sentence is right?",opts:["Right sentence","Wrong 1","Wrong 2","Wrong 3"],answer:0},
            {stem:"Best answer:",opts:["Best answer","Not this","Not this","Not this"],answer:0}
           ]},
          {type:"write",header:"Write Using Today's Grammar & Vocabulary",color:"#047857",pts:25,
           prompts:[
            `Write a sentence using today's grammar: ${d.grammar}.`,
            "Write about yourself using vocabulary from this lesson.",
            "Describe something from the reading text.",
            "Write a question using today's grammar.",
            "Write your favorite sentence from today's lesson."
           ]},
          {type:"error",header:"Fix the Mistakes",color:"#DC2626",pts:25,
           qs:(mistakes.slice(0,4).map(m=>{const p=m.split('→');return p.length===2?{wrong:p[0].trim(),correct:p[1].trim()}:{wrong:m,correct:"(write the correction)"}})).concat([{wrong:"Me am a student.",correct:"I am a student."}]).slice(0,4)}
        ]
      };
    }

    return [...rest.map(d=>{
      if(d.exercises) return d;
      return makeSimpleDay(d);
    }), ...remaining.map(makeSimpleDay)];
  })()
];

let curFilter='all';
let exAnswers={};

try{progress=JSON.parse(localStorage.getItem('em_v4')||'{}');}catch(e){}
function saveProgress(day,score){progress[day]=score;try{localStorage.setItem('em_v4',JSON.stringify(progress));}catch(e){}}
function isUnlocked(d){if(d===1)return true;const s=progress[d-1];return s!==undefined&&s>=80;}
function scColor(s){return s>=80?'#059669':s>=60?'#D97706':'#DC2626';}

//  ROUTING
// ══════════════════════════════════════════════════════════════════
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-lang').style.display='none';
  document.getElementById('s-'+id).classList.add('active');
  window.scrollTo(0,0);
}

function chooseLang(l){lang=l;document.getElementById('s-lang').style.display='none';showScreen('dash');renderDash();}
function switchLang(l){lang=l;document.getElementById('ls-ro').className='ls-btn'+(l==='ro'?' on':'');document.getElementById('ls-ru').className='ls-btn'+(l==='ru'?' on':'');renderDash();}
function setFilter(f){curFilter=f;document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));document.getElementById('fb-'+f).classList.add('on');renderGrid();}
function goTo(view,day){if(day!==undefined)selDay=day;showScreen(view);if(view==='dash')renderDash();else if(view==='lesson')renderLesson();else if(view==='exercise')renderExercise();}

function renderDash(){
  initFlags();
  const done=Object.keys(progress).length;
  const scores=Object.values(progress);
  const avg=done?Math.round(scores.reduce((a,b)=>a+b,0)/done):null;
  const pct=Math.round(done/30*100);

  document.getElementById('d-tag').textContent=L('american')+' • CEFR A1';
  document.getElementById('d-para').textContent=L('heroPara');
  document.getElementById('d-ls-lbl').textContent=L('lsLbl');
  document.getElementById('ls-ro').className='ls-btn'+(lang==='ro'?' on':'');
  document.getElementById('ls-ru').className='ls-btn'+(lang==='ru'?' on':'');
  document.getElementById('s-done').textContent=done;document.getElementById('s-done-l').textContent=L('days');
  document.getElementById('s-left').textContent=30-done;document.getElementById('s-left-l').textContent=L('daysLeft');
  document.getElementById('s-avg').textContent=avg||'—';document.getElementById('s-avg-l').textContent=L('avgScore');
  document.getElementById('s-pct').textContent=pct+'%';document.getElementById('s-pct-l').textContent=L('complete');
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('fb-all').textContent=L('showAll');
  document.getElementById('fb-done').textContent=L('showDone');
  document.getElementById('fb-pend').textContent=L('showPend');
  document.getElementById('how-t').textContent=L('howWorks');
  document.getElementById('how-f').textContent=L('howFoot');
  document.getElementById('how-g').innerHTML=['h1','h2','h3','h4'].map((k,i)=>`
    <div class="how-card"><div class="hn">${['1️⃣','2️⃣','3️⃣','4️⃣'][i]}</div><h3>${L(k+'t')}</h3><p>${L(k+'d')}</p></div>`).join('');
  renderGrid();
}

function renderGrid(){
  const days=DAYS.filter(d=>{
    if(curFilter==='done')return progress[d.day]!==undefined;
    if(curFilter==='pend')return progress[d.day]===undefined;
    return true;
  });
  document.getElementById('grid').innerHTML=days.map(d=>{
    const ul=isUnlocked(d.day);
    const sc=progress[d.day];
    const done=sc!==undefined;
    const t=d.tr[lang]?.title||d.title;
    const g=d.tr[lang]?.grammar||d.grammar;
    const v=d.tr[lang]?.vocab||d.vocab;
    return `<div class="dc ${ul?'open':'lkd'}" style="border-top-color:${ul?d.color:'#94A3B8'}"
      ${ul?`onclick="goTo('lesson',${d.day})"`:''}>
      <div class="dc-top">
        <span class="dc-day" style="color:${ul?d.color:'#94A3B8'}">${!ul?'🔒 ':''}Day ${d.day}</span>
        ${done?`<span class="dc-score" style="background:${scColor(sc)}">${sc}/100 ${sc>=80?'✓':'↺'}</span>`
               :ul?`<span class="dc-dot"></span>`:''}
      </div>
      <div class="dc-title">${t}</div>
      <div class="dc-gram">${g}</div>
      <div class="dc-vocab">📝 ${v}</div>
      ${d.isReview?`<span class="badge-r">${L('reviewBadge')}</span>`:''}
      ${d.isGrad?`<span class="badge-g">${L('gradBadge')}</span>`:''}
      ${!ul?`<div class="lk-hint">${L('lockNote')} ${d.day-1}</div>`:''}
      <div class="dc-btns">
        ${ul?`
          <button class="dc-btn" style="background:${d.color}" onclick="event.stopPropagation();goTo('lesson',${d.day})">${done?L('continueLesson'):L('startLesson')}</button>
          <button class="dc-btn" style="background:#334155" onclick="event.stopPropagation();goTo('exercise',${d.day})">${L('doExercises')}</button>
        `:`<button class="dc-btn grey" disabled>${L('locked')}</button>`}
      </div>
    </div>`;
  }).join('');
}

function renderExercise(){
  initFlags();
  if(!isUnlocked(selDay)){goTo('lesson');return;}
  const d=DAYS[selDay-1];
  const t=d.tr[lang]?.title||d.title;
  const g=d.tr[lang]?.grammar||d.grammar;

  document.getElementById('eh-bg').style.background=d.color;
  document.getElementById('eb-back').textContent='← '+L('backToCourse');
  document.getElementById('e-badge').textContent=`${L('dayLabel')} ${d.day}`;
  document.getElementById('e-title').textContent=t;
  document.getElementById('e-sub').textContent='✏️ '+L('doExercises')+' — '+g;
  document.getElementById('flag-e').innerHTML=flagSVG();

  exAnswers={mc:{},match:{}};
  let html=`<div class="ex-intro"><p>${lang==='ro'?'Completează toate exercițiile. Apasă <strong>Trimite</strong> la final pentru evaluare AI.':'Выполни все упражнения. Нажми <strong>Отправить</strong> для оценки ИИ.'} Scor minim / Минимальный балл: <code>80/100</code></p></div>`;

  d.exercises.forEach((ex,ei)=>{
    const colors=['#1D4ED8','#7C3AED','#DC2626','#047857','#B45309'];
    const bg=ex.color||colors[ei%5];
    html+=`<div class="ex-section">
      <div class="ex-hdr" style="background:${bg}">
        <span class="eicon">${['✏️','🔘','🔴','🔗','✍️'][ei]||'📝'}</span>
        <h3>${L('ex'+(ei+1))||ex.header}</h3>
        <span class="pts">${ex.pts} ${L('pts')}</span>
      </div>
      <div class="ex-body">`;

    if(ex.type==='fill'){
      ex.qs.forEach((q,qi)=>{
        html+=`<div class="q-item">
          <div class="q-stem"><span class="qnum">${qi+1}.</span> ${q.stem.replace('___',`<input class="blank-input" id="fi-${ei}-${qi}" placeholder="?" size="8">`)}</div>
          <div style="font-size:11px;color:#94A3B8;margin-top:3px">💡 ${q.hint}</div>
        </div>`;
      });
    }
    else if(ex.type==='mc'){
      ex.qs.forEach((q,qi)=>{
        html+=`<div class="q-item"><div class="q-stem"><span class="qnum">${qi+1}.</span> ${q.stem}</div>
          <div class="mc-opts">${q.opts.map((o,oi)=>`<button class="mc-opt" id="mc-${ei}-${qi}-${oi}" onclick="selMC(${ei},${qi},${oi},${q.answer})">${String.fromCharCode(65+oi)}) ${o}</button>`).join('')}</div>
        </div>`;
      });
    }
    else if(ex.type==='error'){
      ex.qs.forEach((q,qi)=>{
        html+=`<div class="q-item">
          <div class="q-stem"><span class="qnum">${qi+1}.</span> ${L('wrongFixed')}</div>
          <div class="err-input">❌ ${q.wrong}</div>
          <input class="fix-input" id="er-${ei}-${qi}" placeholder="✅ Write the correct sentence..." data-correct="${q.correct}">
        </div>`;
      });
    }
    else if(ex.type==='match'){
      const shuffled=[...ex.pairs].map((p,i)=>({val:p[1],idx:i})).sort(()=>Math.random()-.5);
      html+=`<div style="margin-bottom:8px;font-size:13px;color:#475569">${lang==='ro'?'Potrivește cuvântul cu definiția:':'Сопоставь слово с определением:'}</div>`;
      ex.pairs.forEach((p,pi)=>{
        html+=`<div class="match-area"><div class="match-left">${pi+1}. <strong>${p[0]}</strong></div>
          <select class="match-sel" id="ma-${ei}-${pi}">
            <option value="">— ${lang==='ro'?'alege':'выбери'} —</option>
            ${shuffled.map((s,si)=>`<option value="${s.idx}">${s.val}</option>`).join('')}
          </select></div>`;
      });
    }
    else if(ex.type==='write'){
      ex.prompts.forEach((p,pi)=>{
        html+=`<div class="q-item"><div class="q-stem"><span class="qnum">${pi+1}.</span> ${p}</div>
          <textarea class="write-area" id="wr-${ei}-${pi}" placeholder="${lang==='ro'?'Scrie răspunsul tău...':'Напиши свой ответ...'}" rows="2"></textarea>
        </div>`;
      });
    }
    html+=`</div></div>`;
  });

  html+=`<div class="submit-bar">
    <button class="btn-sec" onclick="goTo('lesson')">${L('backToCourse')}</button>
    <button class="btn-main" id="ex-submit" onclick="submitExercises()">${L('submitEx')}</button>
  </div>
  <div class="loading-box" id="ex-loading">
    <div class="spinner"></div>
    <p>${L('reviewing')}</p>
  </div>`;

  document.getElementById('e-content').innerHTML=html;
}

function selMC(ei,qi,oi,correct){
  document.querySelectorAll(`[id^="mc-${ei}-${qi}-"]`).forEach(b=>b.classList.remove('sel'));
  document.getElementById(`mc-${ei}-${qi}-${oi}`).classList.add('sel');
  if(!exAnswers.mc[ei]) exAnswers.mc[ei]={};
  exAnswers.mc[ei][qi]=oi;
}

// ══════════════════════════════════════════════════════════════════
//  COLLECT & SUBMIT EXERCISES
// ══════════════════════════════════════════════════════════════════
function collectAnswers(){
  const d=DAYS[selDay-1];
  const lines=[];
  let autoScore=0;
  let totalAuto=0;

  d.exercises.forEach((ex,ei)=>{
    lines.push(`\n=== Exercise ${ei+1}: ${ex.header} (${ex.pts} pts) ===`);
    if(ex.type==='fill'){
      ex.qs.forEach((q,qi)=>{
        const val=(document.getElementById(`fi-${ei}-${qi}`)?.value||'').trim();
        const correct=val.toLowerCase()===q.answer.toLowerCase();
        if(correct) autoScore+=ex.pts/ex.qs.length;
        totalAuto+=ex.pts/ex.qs.length;
        lines.push(`Q${qi+1}: "${q.stem}" → Student: "${val}" | Correct: "${q.answer}" | ${correct?'✓':'✗'}`);
      });
    }
    else if(ex.type==='mc'){
      ex.qs.forEach((q,qi)=>{
        const sel=exAnswers.mc[ei]?.[qi];
        const correct=sel===q.answer;
        if(correct) autoScore+=ex.pts/ex.qs.length;
        totalAuto+=ex.pts/ex.qs.length;
        lines.push(`Q${qi+1}: "${q.stem}" → Student chose: ${sel!==undefined?q.opts[sel]:'(no answer)'} | Correct: ${q.opts[q.answer]} | ${correct?'✓':'✗'}`);
      });
    }
    else if(ex.type==='error'){
      ex.qs.forEach((q,qi)=>{
        const val=(document.getElementById(`er-${ei}-${qi}`)?.value||'').trim();
        lines.push(`Q${qi+1}: Wrong: "${q.wrong}" → Student fix: "${val}" | Expected: "${q.correct}"`);
      });
    }
    else if(ex.type==='match'){
      ex.pairs.forEach((p,pi)=>{
        const sel=document.getElementById(`ma-${ei}-${pi}`)?.value;
        const correct=sel==pi.toString();
        if(correct) autoScore+=ex.pts/ex.pairs.length;
        totalAuto+=ex.pts/ex.pairs.length;
        lines.push(`Q${pi+1}: "${p[0]}" → Student: "${sel!==undefined&&sel!==''?ex.pairs[parseInt(sel)]?.[1]:'(no answer)'}" | Correct: "${p[1]}" | ${correct?'✓':'✗'}`);
      });
    }
    else if(ex.type==='write'){
      ex.prompts.forEach((p,pi)=>{
        const val=(document.getElementById(`wr-${ei}-${pi}`)?.value||'').trim();
        lines.push(`Q${pi+1}: "${p}" → Student: "${val}"`);
      });
    }
  });

  const baseScore=Math.round(autoScore/totalAuto*100)||0;
  return {text:lines.join('\n'),baseScore};
}

async function submitExercises(){
  const d=DAYS[selDay-1];
  const t=d.tr[lang]?.title||d.title;
  const g=d.tr[lang]?.grammar||d.grammar;
  const {text,baseScore}=collectAnswers();
  const btn=document.getElementById('ex-submit');
  const load=document.getElementById('ex-loading');
  btn.disabled=true;btn.textContent=L('grading');
  load.classList.add('show');

  const langInstr=lang==='ro'
    ?'Respond ENTIRELY in Romanian (limba română). All feedback, explanations, corrections and messages must be in Romanian.'
    :'Respond ENTIRELY in Russian (русский язык). All feedback, explanations, corrections and messages must be in Russian.';

  const prompt=`You are a warm, encouraging American English teacher grading A1 student exercises.
Day ${selDay}: "${t}" — Grammar focus: "${g}"
${langInstr}

The student's auto-score from objective questions is approximately ${baseScore}/100.

Here are their answers:
${text}

Grade this student. The score should reflect their actual performance. A student needs 80+ to unlock the next lesson — so be accurate and fair.

Respond ONLY with valid JSON (no markdown, no backticks):
{
  "score": <number 0-100, weighted average of all exercises>,
  "grade": "<A/B/C/D/F>",
  "emoji": "<one encouraging emoji>",
  "overall_message": "<2-3 warm sentences in ${lang==='ro'?'Romanian':'Russian'}>",
  "corrections": [
    {"question":"<q number and stem>","student_answer":"<what they wrote>","correct_answer":"<correct>","is_correct":<bool>,"explanation":"<simple explanation in ${lang==='ro'?'Romanian':'Russian'}>","tip":"<memory tip in ${lang==='ro'?'Romanian':'Russian'}>"}
  ],
  "grammar_weaknesses": ["<weakness in ${lang==='ro'?'Romanian':'Russian'}>"],
  "strengths": ["<strength in ${lang==='ro'?'Romanian':'Russian'}>"],
  "review_suggestion": "<what to review in ${lang==='ro'?'Romanian':'Russian'}>",
  "motivation": "<motivating message in ${lang==='ro'?'Romanian':'Russian'}>"
}`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1500,
        system:'You are an expert English teacher. Always respond with valid JSON only. No markdown.',
        messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    const raw=data.content?.[0]?.text||'{}';
    const result=JSON.parse(raw.replace(/```json|```/g,'').trim());
    saveProgress(selDay,result.score);
    renderResults(result);
    showScreen('results');
  }catch(e){
    renderResults({error:true});showScreen('results');
  }
  btn.disabled=false;btn.textContent=L('submitEx');
  load.classList.remove('show');
}

// ══════════════════════════════════════════════════════════════════
function renderResults(r){
  const d=DAYS[selDay-1];
  document.getElementById('rb-back').textContent=L('backToCourse');
  document.getElementById('r-retry').textContent=L('resubmit');
  document.getElementById('r-dash').textContent=L('backDash');

  if(r.error){
    document.getElementById('rh-bg').style.background='linear-gradient(135deg,#7F1D1D,#DC2626)';
    document.getElementById('r-emoji').textContent='⚠️';
    document.getElementById('r-score').textContent='—';
    document.getElementById('r-grade').textContent='Error';
    document.getElementById('r-msg').textContent=L('errorMsg');
    document.getElementById('r-banner').innerHTML='';
    document.getElementById('r-cl').innerHTML='';
    return;
  }

  const passed=r.score>=80;
  document.getElementById('rh-bg').style.background=passed
    ?'linear-gradient(135deg,#064E3B,#059669)':'linear-gradient(135deg,#7F1D1D,#DC2626)';
  document.getElementById('r-emoji').textContent=r.emoji||'📝';
  document.getElementById('r-score').textContent=r.score+'/100';
  document.getElementById('r-grade').textContent=`Grade ${r.grade} ${passed?'🎉':'💪'}`;
  document.getElementById('r-msg').textContent=r.overall_message||'';
  document.getElementById('r-banner').innerHTML=passed
    ?`<div class="res-pass">✅ ${L('unlocked')}</div>`
    :`<div class="res-fail">📖 ${L('retry')}</div>`;

  document.getElementById('r-st').textContent=L('strengths');
  document.getElementById('r-it').textContent=L('improve');
  document.getElementById('r-sl').innerHTML=(r.strengths||[]).map(s=>`<p>• ${s}</p>`).join('');
  document.getElementById('r-il').innerHTML=(r.grammar_weaknesses||[]).map(w=>`<p>• ${w}</p>`).join('');

  document.getElementById('r-ct').textContent=L('corrections');
  document.getElementById('r-cl').innerHTML=(r.corrections||[]).map(c=>`
    <div class="corr-item ${c.is_correct?'ok':'bad'}">
      <div class="corr-top"><span>${c.is_correct?'✅':'❌'}</span><span class="corr-q">${c.question}</span></div>
      ${c.is_correct?`<p style="color:#059669;font-size:13px;padding-left:26px">Perfect! ✨</p>`:`
      <div class="corr-detail">
        <p><strong>${L('yourAns')}</strong> <span class="corr-wrong">${c.student_answer}</span></p>
        <p><strong>${L('correctAns')}</strong> <span class="corr-right">${c.correct_answer}</span></p>
        <p><strong>${L('why')}</strong> ${c.explanation}</p>
        ${c.tip?`<div class="tip-pill">${L('tip')} ${c.tip}</div>`:''}
      </div>`}
    </div>`).join('');

  document.getElementById('r-revt').textContent=L('reviewThis');
  document.getElementById('r-revp').textContent=r.review_suggestion||'';
  document.getElementById('r-mot').textContent=L('motivation');
  document.getElementById('r-mop').textContent=r.motivation?`"${r.motivation}"`:'';
}

// ══════════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════════
document.addEventListener("DOMContentLoaded", function() { initFlags(); });
</script>
</body>
